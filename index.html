<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicWave</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            padding: 25px 20px;
            background: #12121a;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #aaa;
        }

        .contenedor {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .buscador {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 25px;
        }

        h2 {
            margin-top: 25px;
        }

        .canciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .cancion {
            background: #171720;
            border-radius: 15px;
            padding: 15px;
            transition: 0.2s;
        }

        .cancion:hover {
            transform: translateY(-4px);
        }

        .portada {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #6c2cff, #ff2c8a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .cancion h3 {
            margin-bottom: 5px;
        }

        .cancion p {
            margin-top: 0;
            color: #999;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 20px;
            background: #7b35ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🎵 MusicWave</h1>
    <p>Tu música, en un solo lugar</p>
</header>

<div class="contenedor">

    <input
        class="buscador"
        type="text"
        placeholder="🔎 Buscar canción o artista..."
        onkeyup="buscar()"
        id="busqueda"
    >

    <h2>🔥 Canciones populares</h2>

    <div class="canciones" id="lista">

        <div class="cancion">
            <div class="portada">🎧</div>
            <h3>Mi Canción</h3>
            <p>Artista</p>
            <button onclick="reproducir('Mi Canción')">
                ▶ Reproducir
            </button>
        </div>

        <div class="cancion">
            <div class="portada">🎶</div>
            <h3>Summer Vibes</h3>
            <p>MusicWave</p>
            <button onclick="reproducir('Summer Vibes')">
                ▶ Reproducir
            </button>
        </div>

        <div class="cancion">
            <div class="portada">🎤</div>
            <h3>Night Music</h3>
            <p>MusicWave</p>
            <button onclick="reproducir('Night Music')">
                ▶ Reproducir
            </button>
        </div>

        <div class="cancion">
            <div class="portada">💿</div>
            <h3>Feel The Beat</h3>
            <p>MusicWave</p>
            <button onclick="reproducir('Feel The Beat')">
                ▶ Reproducir
            </button>
        </div>

    </div>

</div>

<footer>
    © 2026 MusicWave
</footer>

<script>

function reproducir(cancion) {
    alert("🎵 Reproduciendo: " + cancion);
}

function buscar() {

    let texto = document
        .getElementById("busqueda")
        .value
        .toLowerCase();

    let canciones = document
        .getElementById("lista")
        .children;

    for (let i = 0; i < canciones.length; i++) {

        let nombre = canciones[i]
            .innerText
            .toLowerCase();

        if (nombre.includes(texto)) {
            canciones[i].style.display = "block";
        } else {
            canciones[i].style.display = "none";
        }
    }
}

</script>

</body>
</html>
